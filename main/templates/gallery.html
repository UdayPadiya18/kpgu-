<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Kiran & Pallavi Global University</title>

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1224px;
            width: 90%;
            margin: auto;
            padding: 40px 0;
        }

        .title {
            margin-bottom: 2rem;
            text-align: center;
        }

        .video-gallery {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap; /* Ensures responsiveness */
        }

        .video, .iframe-container {
            flex: 1;
            min-width: 300px;
        }

        video {
            width: 100%;
            border-radius: 5px;
            object-fit: cover;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 360px;
            border-radius: 5px;
        }

        @media(max-width: 768px) {
            .video-gallery {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'error' %}
                <center><h4 style="color: firebrick;">{{ message }}</h4></center>
            {% else %}
                <center><h4 style="color: dodgerblue;">{{ message }}</h4></center>
            {% endif %}
        {% endfor %}
    {% endif %}

    <h2 class="title">Video Gallery & 360 video & photo</h2>
    <div class="container">
        <div class="video-gallery">

            <div class="video">
                <a href="{% static 'video/kpgu.mp4' %}" target="_blank">
                    <video controls src="{% static 'video/kpgu.mp4' %}"></video>
                    
                </a>
            </div>

            <div class="video">
                <a href="{% static 'KPGU/kpgu.mp4' %}" target="_blank">
                    <video controls  src="{% static 'KPGU/kpgu_1.mp4' %}"></video>
                </a>
            </div>

            <div class="iframe-container">
                <iframe frameborder="0" allow="xr-spatial-tracking; gyroscope; accelerometer" allowfullscreen scrolling="no" src="https://panoraven.com/en/embed/KUAUY7YXHH"></iframe>
            </div>

        </div>
    </div>

</body>
</html>
